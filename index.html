<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Startup Packs</title>
  <style>
    :root{
      --p-dark:#3a374f; --accent:#ad6c93; --bg:#f5f5f5;
      --pink-soft:#eee7eb; --grey:#abb8c3; --white:#ffffff;
      --gold:#d4af37;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body{font-family:Segoe UI,sans-serif;background:var(--bg);color:var(--p-dark);margin:0}
    header{text-align:center;padding:28px 18px; position:relative}
    .wrap{max-width:1200px;margin:0 auto;padding:0 18px 160px}
    .packs-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}

    .pack-card{background:var(--white);border-radius:15px;padding:26px;border:3px solid transparent;transition:.2s;cursor:pointer}
    .pack-card.selected{border-color:var(--p-dark);background:var(--pink-soft)}
    .pack-card.disabled{border-color:#ad6c93;background:#f6eef3;cursor:default}

    .meta{font-size:.7rem;color:var(--grey);text-transform:uppercase}
    .price-hero{font-size:2.2rem;font-weight:800;color:var(--accent);margin:8px 0}
    .upsell-badge{background:var(--gold);color:#fff;font-size:.7rem;padding:4px 10px;border-radius:12px;font-weight:700;display:inline-block;margin-top:10px}

    .details{margin-top:16px;display:none}
    .pack-card.selected .details{display:block}

    .group-title{
      font-size:.75rem;color:var(--accent);text-transform:uppercase;margin-top:18px;
      padding-bottom:8px;border-bottom:2px solid #eee;font-weight:900;letter-spacing:.5px
    }

    .service-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin:14px 0;
      font-size:.92rem;
    }

    .service-label{
      flex:1;
      min-width:0;
      line-height:1.3;
    }

    .qty-box{
      display:flex;
      align-items:center;
      background:var(--white);
      border:1px solid #ddd;
      border-radius:10px;
      overflow:hidden;
      flex-shrink:0;
    }

    .qty-box button{border:none;background:#eee;padding:6px 12px;cursor:pointer}
    .qty-box input{width:42px;border:none;text-align:center;font-weight:800;padding:6px 0;background:transparent}

    .info-i{
      width:18px;height:18px;background:var(--grey);color:#fff;border-radius:50%;
      text-align:center;font-size:11px;line-height:18px;cursor:help;position:relative;flex-shrink:0;user-select:none
    }
    .info-i:hover::after{
      content:attr(data-info);position:absolute;bottom:130%;left:-10px;
      background:var(--p-dark);color:#fff;padding:12px;border-radius:8px;width:280px;
      font-weight:400;font-size:.85rem;line-height:1.4;z-index:5000;
      box-shadow:0 8px 20px rgba(0,0,0,.35);pointer-events:none;white-space:normal;text-align:left
    }

    .warn{color:#ad6c93;font-size:.82rem;font-weight:900;margin-top:10px}

    .footer-summary{
      position:fixed;left:0;right:0;bottom:18px;
      width:min(920px, calc(100% - 36px));margin:0 auto;
      background:var(--p-dark);color:#fff;padding:18px 22px;border-radius:18px;
      display:flex;justify-content:space-between;align-items:center;z-index:1000
    }
    .btn{background:var(--accent);color:#fff;border:none;padding:14px 22px;border-radius:12px;font-weight:900;cursor:pointer}
    .btn:disabled{background:var(--grey);cursor:not-allowed;opacity:.6}
    .small{opacity:.75;font-size:.9rem}

    .brand{position:absolute;left:18px;top:20px;display:inline-flex;align-items:center}
    .brand img{height:50px;display:block}

    /* Switch langue propre */
    .lang-switch{
      position:absolute;
      top:18px;
      right:18px;
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:900;
      font-size:.95rem;
      user-select:none;
    }
    .lang-switch a{
      text-decoration:none;
      color:var(--p-dark);
      opacity:.55;
      padding:6px 8px;
      border-radius:10px;
      transition:opacity .15s ease, background .15s ease;
    }
    .lang-switch a:hover{
      opacity:.9;
      background:rgba(0,0,0,.05);
    }
    .lang-switch a.active{
      opacity:1;
      background:rgba(0,0,0,.06);
    }
    .lang-switch .sep{opacity:.35}
    .lang-switch a#langEN{ color:var(--accent); }

    /* Correction mobile modale */
    .modal{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.55);
      z-index:9999;
      padding:18px;
      overflow-y:auto;
      -webkit-overflow-scrolling: touch;
    }
    .modal-card{
      width:min(860px, calc(100% - 24px));
      margin:40px auto;
      background:#fff;
      border-radius:18px;
      padding:22px;
      box-shadow:0 22px 60px rgba(0,0,0,.22);
      max-height: calc(100dvh - 36px);
      overflow:auto;
    }

    .modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px;}
    .modal-head h2{margin:0;font-size:1.35rem}
    .muted{margin:6px 0 0 0;opacity:.75}

    .btn-ghost{border:1px solid #e6e6e6;background:#f4f4f4;border-radius:12px;padding:10px 12px;font-weight:900;cursor:pointer;}

    .lead-grid{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap:14px;
      margin-top:10px;
    }
    .field{display:flex;flex-direction:column;gap:6px; min-width:0;}
    .field.full{grid-column:1 / -1}
    .field label{font-size:.9rem;font-weight:900}
    .field input{width:100%; min-width:0; padding:12px 12px;border:1px solid #ddd;border-radius:12px;outline:none;}
    .field input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(173,108,147,.18);}

    .recap-wrap{margin-top:16px;padding:14px;border:1px solid #eee;border-radius:16px;background:#fafafa;}
    .recap-title{font-weight:900;margin-bottom:10px}

    .recap-box{background:#ffffff;border:1px solid #eaeaea;border-radius:14px;padding:16px;max-height:320px;overflow:auto;font-size:.92rem;}
    .recap-pack{margin-bottom:18px}
    .recap-pack-title{font-weight:900;margin-bottom:8px;font-size:1rem}
    .recap-line{display:flex;justify-content:space-between;padding:4px 0;opacity:.92}
    .recap-total{margin-top:10px;padding-top:10px;border-top:1px solid #eee;font-weight:900;display:flex;justify-content:space-between;}
    .recap-grand{margin-top:14px;padding-top:14px;border-top:2px solid #ddd;font-size:1.05rem;font-weight:900;display:flex;justify-content:space-between;}

    .hint{margin-top:10px;font-size:.9rem;opacity:.8}
    .modal-actions{display:flex;justify-content:flex-end;margin-top:16px}
    .btn-primary{border:none;background:var(--accent);color:#fff;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer;}

    @media (max-width:900px){.packs-grid{grid-template-columns:1fr}}

    @media (max-width:980px){
      .lead-grid{grid-template-columns:1fr;}
    }

    @media (max-width:820px){
      .modal{ padding:12px; }
      .modal-card{
        margin:12px auto;
        max-height: calc(100dvh - 24px);
        padding-bottom:26px;
      }
      .brand{position:static;justify-content:center;margin-bottom:10px}
      header{text-align:center}
      .lang-switch{
        position:static;
        justify-content:center;
        margin-top:10px;
      }
    }
  </style>
</head>
<body>

  <header>
    <a class="brand" href="https://bridgingsolutions.fr/" target="_blank" rel="noopener noreferrer">
      <img src="https://bridgingsolutions.fr/wp-content/uploads/2025/04/cropped-logo_BRIDGING-1536x474-1-300x93-1.png" alt="Bridging">
    </a>

    <div class="lang-switch" aria-label="Language switch">
      <a id="langFR" href="?lang=fr">FR</a>
      <span class="sep">|</span>
      <a id="langEN" href="?lang=en">EN</a>
    </div>

    <h1 id="pageTitle">Votre pack startup</h1>
    <div id="pageSubtitle" class="small">Sélectionnez un ou plusieurs packs.</div>
    <div id="status" class="small" style="margin-top:6px;"></div>
  </header>

  <div class="wrap">
    <div id="grid" class="packs-grid"></div>
  </div>

  <div class="footer-summary">
    <div>
      <div id="statusText" class="small">Sélectionnez vos packs</div>
      <div id="grandTotal" style="font-size:2.2rem;font-weight:900;">0 €</div>
    </div>
    <button id="btnBooking" class="btn" disabled>Réserver cet accompagnement</button>
  </div>

  <div id="leadModal" class="modal">
    <div class="modal-card">
      <div class="modal-head">
        <div>
          <h2 id="leadTitle">Vos coordonnées</h2>
          <p id="leadSubtitle" class="muted">Vous allez recevoir votre récapitulatif par email.</p>
        </div>
        <button id="closeLeadModal" type="button" class="btn-ghost">Fermer</button>
      </div>

      <div class="lead-grid">
        <div class="field full"><label id="lCompany">Entreprise</label><input id="fCompany" type="text" placeholder="Nom de l’entreprise"></div>
        <div class="field"><label id="lFirst">Prénom</label><input id="fFirst" type="text" placeholder="Prénom"></div>
        <div class="field"><label id="lLast">Nom</label><input id="fLast" type="text" placeholder="Nom"></div>
        <div class="field"><label id="lEmail">Email</label><input id="fEmail" type="email" placeholder="email@exemple.com"></div>
        <div class="field"><label id="lPhone">Téléphone</label><input id="fPhone" type="tel" placeholder="+33 …"></div>
      </div>

      <div class="recap-wrap">
        <div id="recapTitle" class="recap-title">Récapitulatif</div>
        <div id="fRecap" class="recap-box"></div>
        <div id="leadHint" class="hint"></div>
      </div>

      <div class="modal-actions">
        <button id="sendLead" type="button" class="btn-primary">Envoyer et réserver</button>
      </div>
    </div>
  </div>

<script>
  const SHEET_CSV_URL = "https://bridgingsolutions.cellie-piraud.workers.dev/catalog";
  const WORKER_SEND_URL = "https://bridgingsolutions.cellie-piraud.workers.dev/send";

  const BOOKING_URL_FR = "https://outlook.office.com/book/RunionAccompagnementPackStratup@bridgingsolutions.fr/?ismsaljsauthenabled";
  const BOOKING_URL_EN = "https://outlook.office.com/book/RunionAccompagnementPackStratupCopier@bridgingsolutions.fr/?ismsaljsauthenabled";

  const LANG = (new URLSearchParams(location.search).get("lang") || "fr").toLowerCase();
  const IS_EN = LANG.startsWith("en");

  const UI = {
    fr: {
      pageTitle: "Votre pack startup",
      pageSubtitle: "Sélectionnez un ou plusieurs packs.",
      statusText: "Sélectionnez vos packs",
      btnBooking: "Réserver cet accompagnement",
      leadTitle: "Vos coordonnées",
      leadSubtitle: "Vous allez recevoir votre récapitulatif par email.",
      close: "Fermer",
      lCompany: "Entreprise",
      lFirst: "Prénom",
      lLast: "Nom",
      lEmail: "Email",
      lPhone: "Téléphone",
      recapTitle: "Récapitulatif",
      send: "Envoyer et réserver",
      pending: "Description en attente",
      outOfPack: "Vous sortez du prix préférentiel du pack. Contactez-nous pour passer aux services à la carte : contact@bridgingsolutions.fr ou +33(0)9 50 09 66 36",
      upsellBadge: "-2% appliqués par service additionel",
      outOfPackLabel: "Hors pack",
      packPriceLabel: "Prix pack",
      grandTotalLabel: "Total général",
      packsSelected: (n)=> n + " pack(s) sélectionné(s)"
    },
    en: {
      pageTitle: "Your startup pack",
      pageSubtitle: "Select one or more packs.",
      statusText: "Select your packs",
      btnBooking: "Book this program",
      leadTitle: "Your details",
      leadSubtitle: "You will receive your summary by email.",
      close: "Close",
      lCompany: "Company",
      lFirst: "First name",
      lLast: "Last name",
      lEmail: "Email",
      lPhone: "Phone",
      recapTitle: "Summary",
      send: "Send and book",
      pending: "Description pending",
      outOfPack: "You are outside the pack preferential price. Contact us to switch to à la carte services: contact@bridgingsolutions.fr or +33(0)9 50 09 66 36",
      upsellBadge: "-2% applied on additional services",
      outOfPackLabel: "Outside pack",
      packPriceLabel: "Pack price",
      grandTotalLabel: "Grand total",
      packsSelected: (n)=> n + " pack(s) selected"
    }
  };

  const T = IS_EN ? UI.en : UI.fr;

  function setLangLinks(){
    const fr = document.getElementById("langFR");
    const en = document.getElementById("langEN");
    if(!fr || !en) return;

    const url = new URL(window.location.href);

    const frUrl = new URL(url);
    frUrl.searchParams.set("lang","fr");
    fr.href = frUrl.pathname + frUrl.search;

    const enUrl = new URL(url);
    enUrl.searchParams.set("lang","en");
    en.href = enUrl.pathname + enUrl.search;

    fr.classList.toggle("active", !IS_EN);
    en.classList.toggle("active", IS_EN);
  }

  const TR = {
    packs: {
      "Pack Idéation": "Ideation pack",
      "Pack Prototype": "Prototype pack",
      "Pack Homologation": "Certification pack",
      "Pack Industrialisation": "Industrialization pack"
    },
    groups: {
      "Sourcing": "Sourcing",
      "Ingénierie": "Engineering",
      "Qualité/Délai": "Quality and Delivery"
    },
    services: {
      "Sourcing sur étagère": "Off the shelf sourcing",
      "Sourcing sur plan": "Sourcing from drawings",
      "Sourcing sur plan innovation ou fonction complète": "Innovation sourcing from drawings or full function",
      "Sketching/modeling 3D - 3 jours": "3D sketching and modeling 3 days",
      "Design 2D/3D - 3 jours": "2D and 3D design - 3 days",
      "Intégration 1 composant": "Integration of 1 component",
      "Contrôle avant expédition [OQC] - 7h de contrôle - Asie": "Pre shipment inspection OQC 7 hours Asia",
      "Livraison à temps - Un suivi par commande - Asie": "On time delivery one follow up per order Asia",
      "Evaluation fournisseur": "Supplier assessment",
      "Audit RSE": "ESG audit",
      "Audit conformité produit": "Product compliance audit",
      "Audit process avant série - France (Europe + frais réels facturés en sus)": "Pre series process audit France Europe plus travel costs",
      "Audit process avant série Asie": "Pre series process audit Asia",
      "Simulation & Analyse 1 élément": "Simulation and analysis 1 element",
      "Simulation & Analyse - Complexe 3 éléments": "Simulation and analysis complex 3 elements",
      "Analyse de sécurité fonctionnelle": "Functional safety analysis"
    },
    infos: {
  "Produit standardisé fabriqué en série et disponible à l'achat direct, sans développement sur mesure":
    "Standardized mass produced product available for direct purchase, with no custom development required.",

  "Le sourcing sur plan désigne la recherche et la sélection de fournisseurs pour fabriquer des composants ou pièces selon un plan technique fourni":
    "Sourcing from drawings means finding and selecting suppliers to manufacture components or parts based on a provided technical drawing.",

  "Modélisation 3D initiale (CAD) à partir d'idées ou scans pour visualiser le concept":
    "Initial 3D modeling (CAD) from ideas or scans to visualize the concept.",

  "Le sourcing innovation désigne la recherche de solutions sur cahier des charges fonctionnel":
    "Innovation sourcing means searching for solutions based on a functional specification.",

  "Le contrôle avant expédition ou Outgoing Quality Control, est un contrôle qualité réalisé sur les produits finis avant leur expédition, pour vérifier leur conformité aux spécifications":
    "Pre shipment inspection, also called Outgoing Quality Control, is a quality check performed on finished goods before shipment to verify compliance with specifications.",

  "Supervise la ponctualité des fournisseurs et des livraisons":
    "Monitors supplier punctuality and deliveries.",

  "Audit qui évalue la gouvernance, les processus et pratiques d'un fournisseur":
    "Audit that evaluates a supplier governance, processes, and practices.",

  "Evalue les performances ESG":
    "Assesses ESG performance.",

  "Conception élément de structure":
    "Structural element design.",

  "Intégration composant sur structure sur base d'un plan":
    "Component integration on a structure based on a drawing.",

  "Evalue la conformité et la qualification d'un produit aux exigences clients":
    "Assesses product compliance and qualification against customer requirements.",

  "Evalue la conformité d'un process avant démarrage série d'un produit":
    "Assesses process compliance before series production start.",

  "Simulations multiphysiques (mécanique, fluides, électromagnétique) pour homologation performance/sécurité sur plan fourni":
    "Multiphysics simulation (mechanical, fluids, electromagnetic) for certification performance and safety based on the provided drawings.",

  "Utilisation d'outils pour s'assurer que le produit répond aux normes de sécurité sur plan fourni":
    "Use of tools to ensure the product meets safety standards based on the provided drawings."
}
  };

  function trPack(name){ return IS_EN ? (TR.packs[name] || name) : name; }
  function trGroup(name){ return IS_EN ? (TR.groups[name] || name) : name; }
  function trService(name){ return IS_EN ? (TR.services[name] || name) : name; }
  function trInfo(info){ return IS_EN ? (TR.infos[info] || info) : info; }

  function getDelta(name){
    const n = name.trim().toLowerCase();
    if(n.includes("idéation")) return 700;
    if(n.includes("prototype")) return 1000;
    if(n.includes("homologation")) return 1500;
    if(n.includes("industrialisation")) return 1200;
    return 1200;
  }

  const UPSELL_DISCOUNT = 0.02;

  function getBasePrice(name){
    const n = name.trim().toLowerCase();
    if(n.includes("idéation")) return 5000;
    if(n.includes("prototype")) return 7000;
    if(n.includes("homologation")) return 19000;
    if(n.includes("industrialisation")) return 12000;
    return 0;
  }

  function formatEUR(n){
    const num = Math.round(Number(n||0));
    return num.toLocaleString(IS_EN ? "en-GB" : "fr-FR") + " €";
  }

  function clampInt(v,min,max){
    const n=Math.floor(Number(v));
    if(!Number.isFinite(n))return min;
    return Math.max(min,Math.min(max,n));
  }

  function parseNumber(v){
    if(v===null||v===undefined) return 0;
    const s=String(v).replace(/\u202f/g,"").replace(/\u00a0/g,"").replace(/€/g,"").replace(/\s/g,"").replace(",",".");
    const n=Number(s);
    return Number.isFinite(n)?n:0;
  }

  function parseCsv(text){
    const rows=[]; let i=0, field="", row=[], inQuotes=false;
    while(i<text.length){
      const ch=text[i];
      if(ch === '"'){
        if(inQuotes && text[i+1] === '"'){ field+='"'; i+=2; continue; }
        inQuotes=!inQuotes; i++; continue;
      }
      if(!inQuotes && (ch===','||ch==='\n'||ch==='\r')){
        if(ch==='\r' && text[i+1]==='\n') i++;
        row.push(field); field="";
        if(ch==='\n'||ch==='\r'){
          if(row.length>1 || (row[0]||"").trim()!==""){ rows.push(row); }
          row=[];
        }
        i++; continue;
      }
      field+=ch; i++;
    }
    row.push(field); rows.push(row);
    return rows.filter(r=>r.some(c=>String(c).trim()!==""));
  }

  function buildCatalogFromRows(rows){
    const header=rows[0].map(h=>String(h).trim());
    const idx=(name)=>header.indexOf(name);
    const iPack=idx("PackName"), iGroup=idx("GroupName"), iService=idx("ServiceName"),
          iInfo=idx("Info"), iUnit=idx("UnitPrice"), iDef=idx("DefaultQty");
    if([iPack,iGroup,iService,iInfo,iUnit,iDef].some(x=>x<0)) throw new Error("Colonnes manquantes dans le CSV");

    const packsMap=new Map();
    for(let r=1;r<rows.length;r++){
      const line=rows[r];
      const packName=String(line[iPack]||"").trim();
      const groupName=String(line[iGroup]||"").trim();
      const serviceName=String(line[iService]||"").trim();
      if(!packName||!groupName||!serviceName) continue;

      const info=String(line[iInfo]||"").trim();
      const unitPrice=parseNumber(line[iUnit]);
      const defaultQty=clampInt(line[iDef],0,999);

      if(!packsMap.has(packName)) packsMap.set(packName,{ name: packName, basePrice: getBasePrice(packName), groups: [] });
      const pack=packsMap.get(packName);

      let group=pack.groups.find(g=>g.name===groupName);
      if(!group){ group={ name: groupName, services: [] }; pack.groups.push(group); }

      const serviceId=packName+"||"+groupName+"||"+serviceName;
      group.services.push({ id: serviceId, title: serviceName, info, unitPrice, defaultQty });
    }
    return Array.from(packsMap.values());
  }

  function initialSelection(packs){
    const sel=new Map();
    for(const p of packs){
      const services=new Map();
      for(const g of p.groups) for(const s of g.services) services.set(s.id, s.defaultQty);
      sel.set(p.name,{ active:false, services });
    }
    return sel;
  }

  function computePack(pack, packSel){
    const base=Number(pack.basePrice)||0;
    const threshold = base - getDelta(pack.name);
    let servicesSum=0, addedSum=0;

    for(const g of pack.groups){
      for(const s of g.services){
        const q=clampInt(packSel.services.get(s.id),0,999);
        servicesSum += (Number(s.unitPrice)||0) * q;
        const addedQty=Math.max(0, q - clampInt(s.defaultQty,0,999));
        addedSum += (Number(s.unitPrice)||0) * addedQty;
      }
    }

    if(servicesSum < threshold) return { ok:false, message: T.outOfPack, displayPrice:null, isUpsell:false };
    if(servicesSum <= base) return { ok:true, message:"", displayPrice: base, isUpsell:false };

    const discount = addedSum * UPSELL_DISCOUNT;
    const displayPrice = base + (addedSum - discount);
    return { ok:true, message:"", displayPrice, isUpsell: displayPrice > base };
  }

  let PACKS=[], SELECTION=null;

  function clearNode(node){ while(node.firstChild) node.removeChild(node.firstChild); }

  function render(){
    const grid=document.getElementById("grid");
    clearNode(grid);

    let total=0, count=0, hasError=false;

    for(const pack of PACKS){
      const sel=SELECTION.get(pack.name);
      const calc=computePack(pack, sel);

      const card=document.createElement("div");
      card.className="pack-card";
      if(sel.active) card.classList.add("selected");
      if(!calc.ok) card.classList.add("disabled");

      card.addEventListener("click",(e)=>{
        if(e.target.tagName==="BUTTON"||e.target.tagName==="INPUT") return;
        if(!calc.ok) return;
        sel.active=!sel.active;
        render();
      });

      const meta=document.createElement("div"); meta.className="meta"; card.appendChild(meta);

      const title=document.createElement("h3");
      title.style.margin="6px 0";
      title.textContent=trPack(pack.name);
      card.appendChild(title);

      const price=document.createElement("div");
      price.className="price-hero";
      price.textContent=calc.ok ? formatEUR(calc.displayPrice) : "";
      card.appendChild(price);

      if(calc.isUpsell){
        const badge=document.createElement("div");
        badge.className="upsell-badge";
        badge.textContent=T.upsellBadge;
        card.appendChild(badge);
      }

      const details=document.createElement("div"); details.className="details";

      for(const group of pack.groups){
        const gTitle=document.createElement("div");
        gTitle.className="group-title";
        gTitle.textContent=trGroup(group.name);
        details.appendChild(gTitle);

        for(const svc of group.services){
          const row=document.createElement("div"); row.className="service-row";

          const info=document.createElement("span"); info.className="info-i"; info.textContent="i";
          const tipFR = svc.info || T.pending;
          info.setAttribute("data-info", trInfo(tipFR) || T.pending);
          row.appendChild(info);

          const label=document.createElement("span");
          label.className="service-label";
          label.textContent=trService(svc.title);
          row.appendChild(label);

          const qtyBox=document.createElement("div"); qtyBox.className="qty-box";

          const btnMinus=document.createElement("button"); btnMinus.textContent="−";
          btnMinus.addEventListener("click",(ev)=>{
            ev.stopPropagation();
            const cur=clampInt(sel.services.get(svc.id),0,999);
            sel.services.set(svc.id, clampInt(cur-1,0,999));
            render();
          });

          const input=document.createElement("input"); input.type="text"; input.readOnly=true;
          input.value=String(clampInt(sel.services.get(svc.id),0,999));

          const btnPlus=document.createElement("button"); btnPlus.textContent="+";
          btnPlus.addEventListener("click",(ev)=>{
            ev.stopPropagation();
            const cur=clampInt(sel.services.get(svc.id),0,999);
            sel.services.set(svc.id, clampInt(cur+1,0,999));
            render();
          });

          qtyBox.appendChild(btnMinus); qtyBox.appendChild(input); qtyBox.appendChild(btnPlus);
          row.appendChild(qtyBox);

          details.appendChild(row);
        }
      }

      if(!calc.ok){
        const warn=document.createElement("div");
        warn.className="warn";
        warn.textContent=calc.message;
        details.appendChild(warn);
      }

      card.appendChild(details);

      if(sel.active && calc.ok){ total += calc.displayPrice; count += 1; }
      if(sel.active && !calc.ok) hasError=true;

      grid.appendChild(card);
    }

    document.getElementById("grandTotal").textContent=formatEUR(total);
    document.getElementById("statusText").textContent=T.packsSelected(count);
    document.getElementById("btnBooking").disabled=(count===0 || hasError);
  }

  function escapeHtml(s){
    return String(s)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function buildRecapHTML(){
    let html = "", grandTotal = 0;

    for(const pack of PACKS){
      const sel = SELECTION.get(pack.name);
      if(!sel.active) continue;

      const calc = computePack(pack, sel);

      html += `<div class="recap-pack"><div class="recap-pack-title">${escapeHtml(trPack(pack.name))}</div>`;

      if(!calc.ok){
        html += `<div class="recap-line" style="color:#ad6c93;font-weight:900;">${escapeHtml(T.outOfPackLabel)}</div></div>`;
        continue;
      }

      for(const group of pack.groups){
        for(const svc of group.services){
          const q = clampInt(sel.services.get(svc.id),0,999);
          if(q > 0){
            html += `<div class="recap-line"><div>${escapeHtml(trService(svc.title))} x ${q}</div></div>`;
          }
        }
      }

      html += `<div class="recap-total"><div>${escapeHtml(T.packPriceLabel)}</div><div>${formatEUR(calc.displayPrice)}</div></div></div>`;
      grandTotal += calc.displayPrice;
    }

    html += `<div class="recap-grand"><div>${escapeHtml(T.grandTotalLabel)}</div><div>${formatEUR(grandTotal)}</div></div>`;
    return html;
  }

  function openLeadModal(){
    document.getElementById("fRecap").innerHTML = buildRecapHTML();
    document.getElementById("leadModal").style.display="block";
  }

  function closeLeadModal(){
    document.getElementById("leadModal").style.display="none";
  }

  async function boot(){
    setLangLinks();

    document.getElementById("pageTitle").textContent = T.pageTitle;
    document.getElementById("pageSubtitle").textContent = T.pageSubtitle;
    document.getElementById("statusText").textContent = T.statusText;
    document.getElementById("btnBooking").textContent = T.btnBooking;

    document.getElementById("leadTitle").textContent = T.leadTitle;
    document.getElementById("leadSubtitle").textContent = T.leadSubtitle;
    document.getElementById("closeLeadModal").textContent = T.close;

    document.getElementById("lCompany").textContent = T.lCompany;
    document.getElementById("lFirst").textContent = T.lFirst;
    document.getElementById("lLast").textContent = T.lLast;
    document.getElementById("lEmail").textContent = T.lEmail;
    document.getElementById("lPhone").textContent = T.lPhone;

    document.getElementById("recapTitle").textContent = T.recapTitle;
    document.getElementById("sendLead").textContent = T.send;

    const res=await fetch(SHEET_CSV_URL,{ cache:"no-store" });
    if(!res.ok) return;

    const text=await res.text();
    PACKS=buildCatalogFromRows(parseCsv(text));
    SELECTION=initialSelection(PACKS);

    document.getElementById("status").textContent="";

    document.getElementById("btnBooking").addEventListener("click", openLeadModal);
    document.getElementById("closeLeadModal").addEventListener("click", closeLeadModal);

    document.getElementById("sendLead").addEventListener("click", async ()=>{
      const bookingUrl = IS_EN ? BOOKING_URL_EN : BOOKING_URL_FR;

      const payload = {
        lang: IS_EN ? "en" : "fr",
        bookingUrl,
        company: document.getElementById("fCompany").value.trim(),
        firstname: document.getElementById("fFirst").value.trim(),
        lastname: document.getElementById("fLast").value.trim(),
        email: document.getElementById("fEmail").value.trim(),
        phone: document.getElementById("fPhone").value.trim(),
        recap: document.getElementById("fRecap").innerText,
        hasUpsell: document.querySelectorAll(".upsell-badge").length > 0
      };

      if(!payload.company || !payload.firstname || !payload.lastname || !payload.email || !payload.phone) return;

      try {
        await fetch(WORKER_SEND_URL, {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify(payload)
        });

        window.open(bookingUrl, "_blank");
        closeLeadModal();
      } catch(e) {}
    });

    render();
  }

  boot();
</script>
</body>
