<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Startup Packs</title>

<style>
:root{
  --p-dark:#3a374f; --accent:#ad6c93; --bg:#f5f5f5;
  --pink-soft:#eee7eb; --grey:#abb8c3; --white:#ffffff;
  --gold:#d4af37;
}

*, *::before, *::after { box-sizing: border-box; }

body{
  font-family:Segoe UI,sans-serif;
  background:var(--bg);
  color:var(--p-dark);
  margin:0;
}

header{text-align:center;padding:28px 18px; position:relative}
.wrap{max-width:1200px;margin:0 auto;padding:0 18px 160px}
.packs-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}

.pack-card{
  background:var(--white);
  border-radius:15px;
  padding:26px;
  border:3px solid transparent;
  transition:.2s;
  cursor:pointer;
}
.pack-card.selected{border-color:var(--p-dark);background:var(--pink-soft)}
.pack-card.disabled{border-color:#ad6c93;background:#f6eef3;cursor:default}

.meta{font-size:.7rem;color:var(--grey);text-transform:uppercase}
.price-hero{font-size:2.2rem;font-weight:800;color:var(--accent);margin:8px 0}
.upsell-badge{
  background:var(--gold);color:#fff;font-size:.7rem;
  padding:4px 10px;border-radius:12px;font-weight:700;
  display:inline-block;margin-top:10px
}

.details{margin-top:16px;display:none}
.pack-card.selected .details{display:block}

.group-title{
  font-size:.75rem;color:var(--accent);
  text-transform:uppercase;margin-top:18px;
  padding-bottom:8px;border-bottom:2px solid #eee;
  font-weight:900;letter-spacing:.5px
}

.service-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:14px 0;
  font-size:.92rem;
}

.service-label{
  flex:1;
  min-width:0;
  line-height:1.3;
}

.qty-box{
  display:flex;
  align-items:center;
  background:var(--white);
  border:1px solid #ddd;
  border-radius:10px;
  overflow:hidden;
  flex-shrink:0;
}

.qty-box button{border:none;background:#eee;padding:6px 12px;cursor:pointer}
.qty-box input{width:42px;border:none;text-align:center;font-weight:800;padding:6px 0;background:transparent}

.info-i{
  width:18px;height:18px;background:var(--grey);color:#fff;
  border-radius:50%;text-align:center;font-size:11px;
  line-height:18px;cursor:help;position:relative;
  flex-shrink:0;user-select:none
}

.info-i:hover::after{
  content:attr(data-info);
  position:absolute;
  bottom:130%;
  left:-10px;
  background:var(--p-dark);
  color:#fff;
  padding:12px;
  border-radius:8px;
  width:280px;
  font-weight:400;
  font-size:.85rem;
  line-height:1.4;
  z-index:5000;
  box-shadow:0 8px 20px rgba(0,0,0,.35);
  pointer-events:none;
  white-space:normal;
  text-align:left
}

.warn{color:#ad6c93;font-size:.82rem;font-weight:900;margin-top:10px}

.footer-summary{
  position:fixed;
  left:0;
  right:0;
  bottom:18px;
  width:min(920px, calc(100% - 36px));
  margin:0 auto;
  background:var(--p-dark);
  color:#fff;
  padding:18px 22px;
  border-radius:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:1000
}

.btn{
  background:var(--accent);
  color:#fff;
  border:none;
  padding:14px 22px;
  border-radius:12px;
  font-weight:900;
  cursor:pointer
}

.btn:disabled{background:var(--grey);cursor:not-allowed;opacity:.6}

.small{opacity:.75;font-size:.9rem}

.brand{position:absolute;left:18px;top:20px;display:inline-flex;align-items:center}
.brand img{height:50px;display:block}

/* =========================
   ✅ CORRECTION MOBILE MODALE
   ========================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:9999;
  padding:18px;

  /* IMPORTANT */
  overflow-y:auto;
  -webkit-overflow-scrolling: touch;
}

.modal-card{
  width:min(860px, calc(100% - 24px));
  margin:40px auto;
  background:#fff;
  border-radius:18px;
  padding:22px;
  box-shadow:0 22px 60px rgba(0,0,0,.22);

  /* IMPORTANT */
  max-height: calc(100dvh - 36px);
  overflow:auto;
}

@media (max-width:820px){
  .modal{ padding:12px; }
  .modal-card{
    margin:12px auto;
    max-height: calc(100dvh - 24px);
    padding-bottom:26px;
  }
}

/* ========================= */

.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px;}
.modal-head h2{margin:0;font-size:1.35rem}
.muted{margin:6px 0 0 0;opacity:.75}

.btn-ghost{border:1px solid #e6e6e6;background:#f4f4f4;border-radius:12px;padding:10px 12px;font-weight:900;cursor:pointer;}

.lead-grid{
  display:grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap:14px;
  margin-top:10px;
}

.field{display:flex;flex-direction:column;gap:6px; min-width:0;}
.field.full{grid-column:1 / -1}
.field label{font-size:.9rem;font-weight:900}
.field input{
  width:100%;
  min-width:0;
  padding:12px 12px;
  border:1px solid #ddd;
  border-radius:12px;
  outline:none;
}
.field input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(173,108,147,.18);
}

.recap-wrap{
  margin-top:16px;
  padding:14px;
  border:1px solid #eee;
  border-radius:16px;
  background:#fafafa;
}

.recap-title{font-weight:900;margin-bottom:10px}

.recap-box{
  background:#ffffff;
  border:1px solid #eaeaea;
  border-radius:14px;
  padding:16px;
  max-height:320px;
  overflow:auto;
  font-size:.92rem;
}

.recap-pack{margin-bottom:18px}
.recap-pack-title{font-weight:900;margin-bottom:8px;font-size:1rem}
.recap-line{display:flex;justify-content:space-between;padding:4px 0;opacity:.92}
.recap-total{margin-top:10px;padding-top:10px;border-top:1px solid #eee;font-weight:900;display:flex;justify-content:space-between;}
.recap-grand{margin-top:14px;padding-top:14px;border-top:2px solid #ddd;font-size:1.05rem;font-weight:900;display:flex;justify-content:space-between;}

.hint{margin-top:10px;font-size:.9rem;opacity:.8}
.modal-actions{display:flex;justify-content:flex-end;margin-top:16px}
.btn-primary{border:none;background:var(--accent);color:#fff;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer;}

@media (max-width:900px){.packs-grid{grid-template-columns:1fr}}
@media (max-width:980px){.lead-grid{grid-template-columns:1fr;}}

</style>
</head>
<body>
