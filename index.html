<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Startup Packs</title>
  <style>
    :root{
      --p-dark:#3a374f;
      --accent:#ad6c93;
      --bg:#f5f5f5;
      --pink-soft:#eee7eb;
      --grey:#abb8c3;
      --white:#ffffff;
      --gold:#d4af37;
      --line:#ececf0;
    }

    *, *::before, *::after { box-sizing:border-box; }

    body{
      margin:0;
      font-family:Segoe UI,sans-serif;
      background:var(--bg);
      color:var(--p-dark);
    }

    header{
      text-align:center;
      padding:28px 18px;
      position:relative;
    }

    .wrap{
      max-width:1200px;
      margin:0 auto;
      padding:0 18px 160px;
    }

    .packs-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:22px;
    }

    .pack-card{
      background:var(--white);
      border-radius:15px;
      padding:26px;
      border:3px solid transparent;
      transition:.2s ease;
      cursor:pointer;
    }

    .pack-card.open{
      border-color:#ddd;
    }

    .pack-card.selected{
      border-color:var(--p-dark);
      background:var(--pink-soft);
    }

    .pack-top{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:16px;
    }

    .pack-top-left{
      min-width:0;
      flex:1;
    }

    .pack-title{
      margin:0 0 8px 0;
      font-size:1.35rem;
      line-height:1.2;
    }

    .price-row{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }

    .price-hero{
      font-size:2.2rem;
      font-weight:800;
      color:var(--accent);
      margin:0;
      line-height:1;
    }

    .pack-top-right{
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:8px;
      flex-shrink:0;
    }

    .selected-badge{
      background:var(--p-dark);
      color:#fff;
      font-size:.75rem;
      font-weight:800;
      padding:6px 10px;
      border-radius:999px;
    }

    .upsell-badge{
      background:var(--gold);
      color:#fff;
      font-size:.7rem;
      padding:4px 10px;
      border-radius:12px;
      font-weight:700;
      display:inline-block;
      margin-top:10px;
    }

    .info-i{
      width:18px;
      height:18px;
      background:var(--grey);
      color:#fff;
      border-radius:50%;
      text-align:center;
      font-size:11px;
      line-height:18px;
      cursor:help;
      position:relative;
      flex-shrink:0;
      user-select:none;
      display:inline-block;
      vertical-align:middle;
    }

    .info-i:hover::after{
      content:attr(data-info);
      position:absolute;
      bottom:130%;
      left:-10px;
      background:var(--p-dark);
      color:#fff;
      padding:12px;
      border-radius:8px;
      width:280px;
      font-weight:400;
      font-size:.85rem;
      line-height:1.4;
      z-index:5000;
      box-shadow:0 8px 20px rgba(0,0,0,.35);
      pointer-events:none;
      white-space:normal;
      text-align:left;
    }

    .details{
      display:none;
      margin-top:18px;
      padding-top:18px;
      border-top:1px solid var(--line);
      cursor:default;
    }

    .pack-card.open .details{
      display:block;
    }

    .group-title{
      font-size:.75rem;
      color:var(--accent);
      text-transform:uppercase;
      margin-top:18px;
      padding-bottom:8px;
      border-bottom:2px solid #eee;
      font-weight:900;
      letter-spacing:.5px;
    }

    .service-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin:14px 0;
      font-size:.92rem;
    }

    .service-left{
      display:flex;
      align-items:flex-start;
      gap:10px;
      min-width:0;
      flex:1;
    }

    .service-label{
      flex:1;
      min-width:0;
      line-height:1.3;
    }

    .qty-box{
      display:flex;
      align-items:center;
      background:var(--white);
      border:1px solid #ddd;
      border-radius:10px;
      overflow:hidden;
      flex-shrink:0;
    }

    .qty-box button{
      border:none;
      background:#eee;
      padding:6px 12px;
      cursor:pointer;
      font:inherit;
    }

    .qty-box input{
      width:42px;
      border:none;
      text-align:center;
      font-weight:800;
      padding:6px 0;
      background:transparent;
    }

    .builder-panel{
      margin-top:18px;
      padding:16px;
      border:1px solid #ececf0;
      background:#fafafa;
      border-radius:14px;
    }

    .actions-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-top:6px;
      flex-wrap:wrap;
    }

    .status-wrap{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
      min-width:0;
      flex:1;
    }

    .status-lock{
      color:var(--accent);
      font-weight:800;
      font-size:.92rem;
      line-height:1.4;
    }

    .status-ok{
      color:var(--p-dark);
      font-weight:800;
      font-size:.92rem;
      line-height:1.4;
    }

    .btn-linkish{
      border:none;
      background:transparent;
      padding:0;
      color:var(--accent);
      font-weight:800;
      cursor:pointer;
      font:inherit;
    }

    .btn-pack{
      border:none;
      background:var(--accent);
      color:#fff;
      border-radius:12px;
      padding:12px 16px;
      font-weight:900;
      cursor:pointer;
      font:inherit;
    }

    .btn-pack:disabled{
      background:var(--grey);
      cursor:not-allowed;
      opacity:.6;
    }

    .footer-summary{
      position:fixed;
      left:0;
      right:0;
      bottom:18px;
      width:min(920px, calc(100% - 36px));
      margin:0 auto;
      background:var(--p-dark);
      color:#fff;
      padding:18px 22px;
      border-radius:18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      z-index:1000;
      gap:20px;
    }

    .btn{
      background:var(--accent);
      color:#fff;
      border:none;
      padding:14px 22px;
      border-radius:12px;
      font-weight:900;
      cursor:pointer;
      font:inherit;
    }

    .btn:disabled{
      background:var(--grey);
      cursor:not-allowed;
      opacity:.6;
    }

    .small{
      opacity:.75;
      font-size:.9rem;
    }

    .brand{
      position:absolute;
      left:18px;
      top:20px;
      display:inline-flex;
      align-items:center;
    }

    .brand img{
      height:50px;
      display:block;
    }

    .lang-switch{
      position:absolute;
      top:18px;
      right:18px;
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:900;
      font-size:.95rem;
      user-select:none;
    }

    .lang-switch a{
      text-decoration:none;
      color:var(--p-dark);
      opacity:.55;
      padding:6px 8px;
      border-radius:10px;
      transition:opacity .15s ease, background .15s ease;
    }

    .lang-switch a:hover{
      opacity:.9;
      background:rgba(0,0,0,.05);
    }

    .lang-switch a.active{
      opacity:1;
      background:rgba(0,0,0,.06);
    }

    .lang-switch .sep{
      opacity:.35;
    }

    .lang-switch a#langEN{
      color:var(--accent);
    }

    .modal{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.55);
      z-index:9999;
      padding:18px;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
    }

    .modal-card{
      width:min(860px, calc(100% - 24px));
      margin:40px auto;
      background:#fff;
      border-radius:18px;
      padding:22px;
      box-shadow:0 22px 60px rgba(0,0,0,.22);
      max-height:calc(100dvh - 36px);
      overflow:auto;
    }

    .modal-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:14px;
      margin-bottom:14px;
    }

    .modal-head h2{
      margin:0;
      font-size:1.35rem;
    }

    .muted{
      margin:6px 0 0 0;
      opacity:.75;
    }

    .btn-ghost{
      border:1px solid #e6e6e6;
      background:#f4f4f4;
      border-radius:12px;
      padding:10px 12px;
      font-weight:900;
      cursor:pointer;
      font:inherit;
    }

    .lead-grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:14px;
      margin-top:10px;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:6px;
      min-width:0;
    }

    .field.full{
      grid-column:1 / -1;
    }

    .field label{
      font-size:.9rem;
      font-weight:900;
    }

    .field input{
      width:100%;
      min-width:0;
      padding:12px 12px;
      border:1px solid #ddd;
      border-radius:12px;
      outline:none;
    }

    .field input:focus{
      border-color:var(--accent);
      box-shadow:0 0 0 4px rgba(173,108,147,.18);
    }

    .recap-wrap{
      margin-top:16px;
      padding:14px;
      border:1px solid #eee;
      border-radius:16px;
      background:#fafafa;
    }

    .recap-title{
      font-weight:900;
      margin-bottom:10px;
    }

    .recap-box{
      background:#ffffff;
      border:1px solid #eaeaea;
      border-radius:14px;
      padding:16px;
      max-height:320px;
      overflow:auto;
      font-size:.92rem;
    }

    .recap-pack{
      margin-bottom:18px;
    }

    .recap-pack-title{
      font-weight:900;
      margin-bottom:8px;
      font-size:1rem;
    }

    .recap-line{
      display:flex;
      justify-content:space-between;
      gap:12px;
      padding:4px 0;
      opacity:.92;
    }

    .recap-total{
      margin-top:10px;
      padding-top:10px;
      border-top:1px solid #eee;
      font-weight:900;
      display:flex;
      justify-content:space-between;
      gap:12px;
    }

    .recap-grand{
      margin-top:14px;
      padding-top:14px;
      border-top:2px solid #ddd;
      font-size:1.05rem;
      font-weight:900;
      display:flex;
      justify-content:space-between;
      gap:12px;
    }

    .hint{
      margin-top:10px;
      font-size:.9rem;
      opacity:.8;
    }

    .modal-actions{
      display:flex;
      justify-content:flex-end;
      margin-top:16px;
    }

    .btn-primary{
      border:none;
      background:var(--accent);
      color:#fff;
      border-radius:12px;
      padding:12px 16px;
      font-weight:900;
      cursor:pointer;
      font:inherit;
    }

    @media (max-width:900px){
      .packs-grid{
        grid-template-columns:1fr;
      }
    }

    @media (max-width:980px){
      .lead-grid{
        grid-template-columns:1fr;
      }
    }

    @media (max-width:820px){
      .modal{
        padding:12px;
      }

      .modal-card{
        margin:12px auto;
        max-height:calc(100dvh - 24px);
        padding-bottom:26px;
      }

      .brand{
        position:static;
        justify-content:center;
        margin-bottom:10px;
      }

      header{
        text-align:center;
      }

      .lang-switch{
        position:static;
        justify-content:center;
        margin-top:10px;
      }

      .footer-summary{
        flex-direction:column;
        align-items:stretch;
      }

      .pack-top{
        flex-direction:column;
        align-items:flex-start;
      }

      .pack-top-right{
        align-items:flex-start;
      }
    }
  </style>
</head>
<body>

  <header>
    <a class="brand" href="https://bridgingsolutions.fr/" target="_blank" rel="noopener noreferrer">
      <img src="https://bridgingsolutions.fr/wp-content/uploads/2025/04/cropped-logo_BRIDGING-1536x474-1-300x93-1.png" alt="Bridging">
    </a>

    <div class="lang-switch" aria-label="Language switch">
      <a id="langFR" href="?lang=fr">FR</a>
      <span class="sep">|</span>
      <a id="langEN" href="?lang=en">EN</a>
    </div>

    <h1 id="pageTitle"></h1>
    <div id="pageSubtitle" class="small"></div>
    <div id="status" class="small" style="margin-top:6px;"></div>
  </header>

  <div class="wrap">
    <div id="grid" class="packs-grid"></div>
  </div>

  <div class="footer-summary">
    <div>
      <div id="statusText" class="small"></div>
      <div id="grandTotal" style="font-size:2.2rem;font-weight:900;">0 €</div>
    </div>
    <button id="btnBooking" class="btn" disabled></button>
  </div>

  <div id="leadModal" class="modal">
    <div class="modal-card">
      <div class="modal-head">
        <div>
          <h2 id="leadTitle"></h2>
          <p id="leadSubtitle" class="muted"></p>
        </div>
        <button id="closeLeadModal" type="button" class="btn-ghost"></button>
      </div>

      <div class="lead-grid">
        <div class="field full">
          <label id="lCompany"></label>
          <input id="fCompany" type="text">
        </div>
        <div class="field">
          <label id="lFirst"></label>
          <input id="fFirst" type="text">
        </div>
        <div class="field">
          <label id="lLast"></label>
          <input id="fLast" type="text">
        </div>
        <div class="field">
          <label id="lEmail"></label>
          <input id="fEmail" type="email">
        </div>
        <div class="field">
          <label id="lPhone"></label>
          <input id="fPhone" type="tel">
        </div>
      </div>

      <div class="recap-wrap">
        <div id="recapTitle" class="recap-title"></div>
        <div id="fRecap" class="recap-box"></div>
        <div id="leadHint" class="hint"></div>
      </div>

      <div class="modal-actions">
        <button id="sendLead" type="button" class="btn-primary"></button>
      </div>
    </div>
  </div>

<script>
  const SHEET_CSV_URL = "https://bridgingsolutions.cellie-piraud.workers.dev/catalog";
  const WORKER_SEND_URL = "https://bridgingsolutions.cellie-piraud.workers.dev/send";

  const BOOKING_URL_FR = "https://outlook.office.com/book/RunionAccompagnementPackStratup@bridgingsolutions.fr/?ismsaljsauthenabled";
  const BOOKING_URL_EN = "https://outlook.office.com/book/RunionAccompagnementPackStratupCopier@bridgingsolutions.fr/?ismsaljsauthenabled";

  const LANG = (new URLSearchParams(location.search).get("lang") || "fr").toLowerCase();
  const IS_EN = LANG.startsWith("en");
  const UPSELL_DISCOUNT = 0.02;

  const UI = {
    fr: {
      pageTitle: "Votre pack startup",
      pageSubtitle: "Cliquez sur un pack pour le composer puis validez-le.",
      statusTextEmpty: "Sélectionnez vos packs",
      statusTextSelected: (n) => n + " pack(s) sélectionné(s)",
      btnBooking: "Visualiser mon accompagnement",
      leadTitle: "Vos coordonnées",
      leadSubtitle: "Vous allez recevoir votre récapitulatif par email et pourrez ensuite réserver votre créneau.",
      close: "Fermer",
      lCompany: "Entreprise",
      lFirst: "Prénom",
      lLast: "Nom",
      lEmail: "Email",
      lPhone: "Téléphone",
      phCompany: "Nom de l’entreprise",
      phFirst: "Prénom",
      phLast: "Nom",
      phEmail: "email@exemple.com",
      phPhone: "+33 …",
      recapTitle: "Récapitulatif",
      send: "Envoyer et réserver",
      pending: "Description en attente",
      choosePack: "Choisir ce pack",
      selectedPack: "Pack sélectionné",
      readyToSelect: "Offre préférentielle disponible",
      packLocked: "Composez votre pack",
      selectedHint: "Ce pack est inclus dans votre sélection.",
      bookingHint: "Sélectionnez au moins un pack pour continuer.",
      aLaCarteInfo: "Composez votre pack pour atteindre l’offre préférentielle ou contactez-nous pour passer aux services à la carte : contact@bridgingsolutions.fr ou +33(0)9 50 09 66 36",
      removePack: "Retirer ce pack",
      upsellBadge: "-2% appliqués par service additionnel",
      packPriceLabel: "Prix pack",
      grandTotalLabel: "Total général HT"
    },
    en: {
      pageTitle: "Your startup pack",
      pageSubtitle: "Click a pack to build it, then validate it.",
      statusTextEmpty: "Select your packs",
      statusTextSelected: (n) => n + " pack(s) selected",
      btnBooking: "View my offer",
      leadTitle: "Your details",
      leadSubtitle: "You will receive your summary by email and can then book your time slot.",
      close: "Close",
      lCompany: "Company",
      lFirst: "First name",
      lLast: "Last name",
      lEmail: "Email",
      lPhone: "Phone",
      phCompany: "Company name",
      phFirst: "First name",
      phLast: "Last name",
      phEmail: "email@example.com",
      phPhone: "+33 ...",
      recapTitle: "Summary",
      send: "Send and book",
      pending: "Description pending",
      choosePack: "Choose this pack",
      selectedPack: "Pack selected",
      readyToSelect: "Preferential offer available",
      packLocked: "Build your pack",
      selectedHint: "This pack is included in your selection.",
      bookingHint: "Select at least one pack to continue.",
      aLaCarteInfo: "Build your pack to reach the preferential offer, or contact us to move to à la carte services: contact@bridgingsolutions.fr or +33(0)9 50 09 66 36",
      removePack: "Remove this pack",
      upsellBadge: "-2% applied on each additional service",
      packPriceLabel: "Pack price",
      grandTotalLabel: "Grand total excl. VAT"
    }
  };

  const T = IS_EN ? UI.en : UI.fr;

  const TR = {
    packs: {
      "Pack Idéation": "Ideation pack",
      "Pack Prototype": "Prototype pack",
      "Pack Homologation": "Certification pack",
      "Pack Industrialisation": "Industrialization pack"
    },
    groups: {
      "Sourcing": "Sourcing",
      "Ingénierie": "Engineering",
      "Qualité/Délai": "Quality and Delivery"
    },
    services: {
      "Sourcing sur étagère": "Off the shelf sourcing",
      "Sourcing sur plan": "Sourcing from drawings",
      "Sourcing innovation ou fonction complète": "Innovation sourcing or full function",
      "Sourcing sur plan - double sourcing": "Sourcing from drawings - dual sourcing",
      "Sketching/modeling 3D - 3 jours": "3D sketching and modeling - 3 days",
      "Design 2D/3D - 3 jours": "2D and 3D design - 3 days",
      "Intégration 1 composant": "Integration of 1 component",
      "Contrôle avant expédition [OQC] - 7h de contrôle - Asie": "Pre shipment inspection [OQC] - 7 hour inspection - Asia",
      "Suivi fabrication - expédition / par commande - Asie": "Production and shipment follow up / per order - Asia",
      "Suivi  fabrication - expédition / par commande - Asie": "Production and shipment follow up / per order - Asia",
      "Evaluation fournisseur": "Supplier assessment",
      "Audit RSE": "ESG audit",
      "Audit conformité produit": "Product compliance audit",
      "Audit process avant série - France (Europe : + frais réels facturés en sus)": "Pre series process audit - France (Europe: additional actual travel costs billed separately)",
      "Audit process avant série Asie": "Pre series process audit - Asia",
      "Simulation & Analyse 1 élément": "Simulation and analysis - 1 element",
      "Simulation & Analyse - Complexe 3 éléments": "Simulation and analysis - complex 3 elements",
      "Analyse de sécurité fonctionnelle": "Functional safety analysis"
    },
    infos: {
      "Produit standardisé fabriqué en série et disponible à l'achat direct, sans développement sur mesure":
        "Standardized mass produced product available for direct purchase, with no custom development required.",
      "Le sourcing sur plan désigne la recherche et la sélection de fournisseurs pour fabriquer des composants ou pièces selon un plan technique fourni":
        "Sourcing from drawings means identifying and selecting suppliers to manufacture components or parts based on a provided technical drawing.",
      "Modélisation 3D initiale (CAD) à partir d'idées ou scans pour visualiser le concept":
        "Initial 3D CAD modeling based on ideas or scans to visualize the concept.",
      "Le sourcing innovation désigne la recherche de solutions sur cahier des charges fonctionnel":
        "Innovation sourcing means identifying solutions based on a functional specification.",
      "Le contrôle avant expédition ou Outgoing Quality Control, est un contrôle qualité réalisé sur les produits finis avant leur expédition, pour vérifier leur conformité aux spécifications":
        "Pre shipment inspection, also called Outgoing Quality Control, is a quality check carried out on finished products before shipment to verify compliance with specifications.",
      "Supervise la ponctualité des fournisseurs et des livraisons":
        "Monitors supplier punctuality and deliveries.",
      "Audit qui évalue l'aptitude, les processus et pratiques d'un fournisseur":
        "Audit that evaluates a supplier's capabilities, processes, and practices.",
      "Evalue les performances ESG":
        "Assesses ESG performance.",
      "Conception élément de structure (3 jours ingéniérie + 1 jour interface Bridging France)":
        "Structural element design (3 engineering days plus 1 coordination day with Bridging France).",
      "Intégration composant sur structure sur base d'un plan (3 jours)":
        "Component integration into a structure based on a drawing (3 days).",
      "Evalue la conformité et la qualification d'un produit aux exigences clients":
        "Assesses a product's compliance and qualification against customer requirements.",
      "Evalue la conformité d'un process avant démarrage série d'un produit":
        "Assesses process compliance before the start of serial production.",
      "Evalue la conformité d'un process autour du démarrage série d'un produit":
        "Assesses process compliance around the start of serial production.",
      "Simulations multiphysiques (mécanique, fluides, électromagnétique) pour homologation performance/sécurité sur plan fourni":
        "Multiphysics simulations (mechanical, fluid, electromagnetic) for certification of performance and safety based on the provided drawings.",
      "Utilisation d'outils pour s'assurer que le produit répond aux normes de sécurité sur plan fourni":
        "Use of engineering tools to ensure the product meets safety standards based on the provided drawings.",
      "Le sourcing sur plan désigne la sélection de fournisseurs selon des plans techniques précis (dessins, specs). Le double sourcing implique un 2ème fournisseur pour le même produit afin de minimiser les risques et optimiser les couts":
        "Sourcing from drawings means selecting suppliers based on precise technical plans and specifications. Dual sourcing means using a second supplier for the same product to reduce risks and optimize costs."
    }
  };

  function normalizeKey(value){
    return String(value || "").replace(/\s+/g, " ").trim();
  }

  function trPack(name){
    const key = normalizeKey(name);
    return IS_EN ? (TR.packs[key] || key) : key;
  }

  function trGroup(name){
    const key = normalizeKey(name);
    return IS_EN ? (TR.groups[key] || key) : key;
  }

  function trService(name){
    const key = normalizeKey(name);
    return IS_EN ? (TR.services[key] || key) : key;
  }

  function trInfo(info){
    const key = normalizeKey(info);
    return IS_EN ? (TR.infos[key] || key) : key;
  }

  function getBasePrice(name){
    const n = normalizeKey(name).toLowerCase();
    if(n.includes("idéation")) return 5000;
    if(n.includes("prototype")) return 7000;
    if(n.includes("homologation")) return 10000;
    if(n.includes("industrialisation")) return 10000;
    return 0;
  }

  function getDelta(name){
    const n = normalizeKey(name).toLowerCase();
    if(n.includes("idéation")) return 700;
    if(n.includes("prototype")) return 1000;
    if(n.includes("homologation")) return 1500;
    if(n.includes("industrialisation")) return 1200;
    return 1200;
  }

  function formatEUR(n){
    const num = Math.round(Number(n || 0));
    return num.toLocaleString(IS_EN ? "en-GB" : "fr-FR") + " €";
  }

  function clampInt(v, min, max){
    const n = Math.floor(Number(v));
    if(!Number.isFinite(n)) return min;
    return Math.max(min, Math.min(max, n));
  }

  function parseNumber(v){
    if(v === null || v === undefined) return 0;
    const s = String(v)
      .replace(/\u202f/g, "")
      .replace(/\u00a0/g, "")
      .replace(/€/g, "")
      .replace(/\s/g, "")
      .replace(",", ".");
    const n = Number(s);
    return Number.isFinite(n) ? n : 0;
  }

  function parseCsv(text){
    const rows = [];
    let i = 0;
    let field = "";
    let row = [];
    let inQuotes = false;

    while(i < text.length){
      const ch = text[i];

      if(ch === '"'){
        if(inQuotes && text[i + 1] === '"'){
          field += '"';
          i += 2;
          continue;
        }
        inQuotes = !inQuotes;
        i++;
        continue;
      }

      if(!inQuotes && (ch === "," || ch === "\t" || ch === "\n" || ch === "\r")){
        if(ch === "\r" && text[i + 1] === "\n") i++;
        row.push(field);
        field = "";

        if(ch === "\n" || ch === "\r"){
          if(row.length > 1 || (row[0] || "").trim() !== ""){
            rows.push(row);
          }
          row = [];
        }

        i++;
        continue;
      }

      field += ch;
      i++;
    }

    row.push(field);
    rows.push(row);

    return rows.filter(r => r.some(c => String(c).trim() !== ""));
  }

  function buildCatalogFromRows(rows){
    const header = rows[0].map(normalizeKey);
    const idx = (name) => header.indexOf(name);

    const iPack = idx("PackName");
    const iGroup = idx("GroupName");
    const iService = idx("ServiceName");
    const iInfo = idx("Info");
    const iUnit = idx("UnitPrice");

    if([iPack, iGroup, iService, iInfo, iUnit].some(x => x < 0)){
      throw new Error("Missing required CSV columns");
    }

    const packsMap = new Map();

    for(let r = 1; r < rows.length; r++){
      const line = rows[r];
      const packName = normalizeKey(line[iPack]);
      const groupName = normalizeKey(line[iGroup]);
      const serviceName = normalizeKey(line[iService]);

      if(!packName || !groupName || !serviceName) continue;

      const info = normalizeKey(line[iInfo]);
      const unitPrice = parseNumber(line[iUnit]);

      if(!packsMap.has(packName)){
        packsMap.set(packName, {
          name: packName,
          basePrice: getBasePrice(packName),
          groups: []
        });
      }

      const pack = packsMap.get(packName);

      let group = pack.groups.find(g => g.name === groupName);
      if(!group){
        group = { name: groupName, services: [] };
        pack.groups.push(group);
      }

      const serviceId = packName + "||" + groupName + "||" + serviceName;

      group.services.push({
        id: serviceId,
        title: serviceName,
        info,
        unitPrice
      });
    }

    return Array.from(packsMap.values());
  }

  function createInitialSelection(packs){
    const selection = new Map();

    for(const pack of packs){
      const services = new Map();
      for(const group of pack.groups){
        for(const service of group.services){
          services.set(service.id, 0);
        }
      }
      selection.set(pack.name, {
        active: false,
        services
      });
    }

    return selection;
  }

  function computePack(pack, packSelection){
    const basePrice = Number(pack.basePrice) || 0;
    const lowerThreshold = basePrice - getDelta(pack.name);

    let servicesSum = 0;
    let totalQty = 0;

    for(const group of pack.groups){
      for(const service of group.services){
        const qty = clampInt(packSelection.services.get(service.id), 0, 999);
        const lineTotal = (Number(service.unitPrice) || 0) * qty;
        servicesSum += lineTotal;
        totalQty += qty;
      }
    }

    const selectable = totalQty > 0 && servicesSum >= lowerThreshold;

    let displayPrice = basePrice;
    let isUpsell = false;

    if(servicesSum > basePrice){
      const extraOverBase = servicesSum - basePrice;
      const discountedExtra = extraOverBase * (1 - UPSELL_DISCOUNT);
      displayPrice = basePrice + discountedExtra;
      isUpsell = true;
    }

    return {
      totalQty,
      servicesSum,
      lowerThreshold,
      selectable,
      displayPrice,
      isUpsell
    };
  }

  function escapeHtml(value){
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function clearNode(node){
    while(node.firstChild) node.removeChild(node.firstChild);
  }

  function setLangLinks(){
    const fr = document.getElementById("langFR");
    const en = document.getElementById("langEN");
    if(!fr || !en) return;

    const currentUrl = new URL(window.location.href);

    const frUrl = new URL(currentUrl);
    frUrl.searchParams.set("lang", "fr");
    fr.href = frUrl.pathname + frUrl.search;

    const enUrl = new URL(currentUrl);
    enUrl.searchParams.set("lang", "en");
    en.href = enUrl.pathname + enUrl.search;

    fr.classList.toggle("active", !IS_EN);
    en.classList.toggle("active", IS_EN);
  }

  let PACKS = [];
  let SELECTION = null;
  let OPEN_PACK_NAME = null;

  function selectedHasUpsell(){
    for(const pack of PACKS){
      const sel = SELECTION.get(pack.name);
      if(!sel || !sel.active) continue;
      const calc = computePack(pack, sel);
      if(calc.isUpsell) return true;
    }
    return false;
  }

  function togglePack(packName){
    OPEN_PACK_NAME = (OPEN_PACK_NAME === packName) ? null : packName;
  }

  function choosePack(packName){
    const pack = PACKS.find(p => p.name === packName);
    const sel = SELECTION.get(packName);
    if(!pack || !sel) return;

    const calc = computePack(pack, sel);
    if(!calc.selectable) return;

    sel.active = true;
    OPEN_PACK_NAME = null;
    render();
  }

  function removePack(packName){
    const sel = SELECTION.get(packName);
    if(!sel) return;
    sel.active = false;
    render();
  }

  function renderPackCard(pack){
    const sel = SELECTION.get(pack.name);
    const calc = computePack(pack, sel);
    const isOpen = OPEN_PACK_NAME === pack.name;

    const card = document.createElement("div");
    card.className = "pack-card";
    if(isOpen) card.classList.add("open");
    if(sel.active) card.classList.add("selected");

    card.addEventListener("click", () => {
      togglePack(pack.name);
      render();
    });

    const top = document.createElement("div");
    top.className = "pack-top";

    const topLeft = document.createElement("div");
    topLeft.className = "pack-top-left";

    const title = document.createElement("h3");
    title.className = "pack-title";
    title.textContent = trPack(pack.name);
    topLeft.appendChild(title);

    const priceRow = document.createElement("div");
    priceRow.className = "price-row";

    const price = document.createElement("div");
    price.className = "price-hero";
    price.textContent = formatEUR(calc.displayPrice);
    priceRow.appendChild(price);

    topLeft.appendChild(priceRow);

    if(calc.isUpsell){
      const badge = document.createElement("div");
      badge.className = "upsell-badge";
      badge.textContent = T.upsellBadge;
      topLeft.appendChild(badge);
    }

    const topRight = document.createElement("div");
    topRight.className = "pack-top-right";

    if(sel.active){
      const selectedBadge = document.createElement("div");
      selectedBadge.className = "selected-badge";
      selectedBadge.textContent = T.selectedPack;
      topRight.appendChild(selectedBadge);
    }

    top.appendChild(topLeft);
    top.appendChild(topRight);
    card.appendChild(top);

    const details = document.createElement("div");
    details.className = "details";
    details.addEventListener("click", (ev) => ev.stopPropagation());

    for(const group of pack.groups){
      const groupTitle = document.createElement("div");
      groupTitle.className = "group-title";
      groupTitle.textContent = trGroup(group.name);
      details.appendChild(groupTitle);

      for(const service of group.services){
        const row = document.createElement("div");
        row.className = "service-row";

        const left = document.createElement("div");
        left.className = "service-left";

        const bubble = document.createElement("span");
        bubble.className = "info-i";
        bubble.textContent = "i";
        bubble.setAttribute("data-info", trInfo(service.info || T.pending) || T.pending);

        const label = document.createElement("span");
        label.className = "service-label";
        label.textContent = trService(service.title);

        left.appendChild(bubble);
        left.appendChild(label);
        row.appendChild(left);

        const qtyBox = document.createElement("div");
        qtyBox.className = "qty-box";

        const btnMinus = document.createElement("button");
        btnMinus.type = "button";
        btnMinus.textContent = "−";
        btnMinus.addEventListener("click", (ev) => {
          ev.stopPropagation();
          const current = clampInt(sel.services.get(service.id), 0, 999);
          sel.services.set(service.id, clampInt(current - 1, 0, 999));

          const updated = computePack(pack, sel);
          if(sel.active && !updated.selectable){
            sel.active = false;
          }

          render();
        });

        const input = document.createElement("input");
        input.type = "text";
        input.readOnly = true;
        input.value = String(clampInt(sel.services.get(service.id), 0, 999));

        const btnPlus = document.createElement("button");
        btnPlus.type = "button";
        btnPlus.textContent = "+";
        btnPlus.addEventListener("click", (ev) => {
          ev.stopPropagation();
          const current = clampInt(sel.services.get(service.id), 0, 999);
          sel.services.set(service.id, clampInt(current + 1, 0, 999));
          render();
        });

        qtyBox.appendChild(btnMinus);
        qtyBox.appendChild(input);
        qtyBox.appendChild(btnPlus);
        row.appendChild(qtyBox);

        details.appendChild(row);
      }
    }

    const builderPanel = document.createElement("div");
    builderPanel.className = "builder-panel";

    const actions = document.createElement("div");
    actions.className = "actions-row";

    if(sel.active){
      const statusWrap = document.createElement("div");
      statusWrap.className = "status-wrap";

      const leftText = document.createElement("div");
      leftText.className = "status-ok";
      leftText.textContent = T.selectedHint;
      statusWrap.appendChild(leftText);

      actions.appendChild(statusWrap);

      const removeBtn = document.createElement("button");
      removeBtn.type = "button";
      removeBtn.className = "btn-linkish";
      removeBtn.textContent = T.removePack;
      removeBtn.addEventListener("click", (ev) => {
        ev.stopPropagation();
        removePack(pack.name);
      });
      actions.appendChild(removeBtn);
    } else {
      const statusWrap = document.createElement("div");
      statusWrap.className = "status-wrap";

      const leftText = document.createElement("div");
      leftText.className = calc.selectable ? "status-ok" : "status-lock";
      leftText.textContent = calc.selectable ? T.readyToSelect : T.packLocked;
      statusWrap.appendChild(leftText);

      const inlineInfo = document.createElement("span");
      inlineInfo.className = "info-i";
      inlineInfo.textContent = "i";
      inlineInfo.setAttribute("data-info", T.aLaCarteInfo);
      statusWrap.appendChild(inlineInfo);

      actions.appendChild(statusWrap);

      const chooseBtn = document.createElement("button");
      chooseBtn.type = "button";
      chooseBtn.className = "btn-pack";
      chooseBtn.textContent = T.choosePack;
      chooseBtn.disabled = !calc.selectable;
      chooseBtn.addEventListener("click", (ev) => {
        ev.stopPropagation();
        choosePack(pack.name);
      });
      actions.appendChild(chooseBtn);
    }

    builderPanel.appendChild(actions);
    details.appendChild(builderPanel);
    card.appendChild(details);

    return { card, calc };
  }

  function render(){
    const grid = document.getElementById("grid");
    clearNode(grid);

    let selectedCount = 0;
    let total = 0;

    for(const pack of PACKS){
      const sel = SELECTION.get(pack.name);
      const { card, calc } = renderPackCard(pack);

      if(sel.active){
        selectedCount += 1;
        total += calc.displayPrice;
      }

      grid.appendChild(card);
    }

    document.getElementById("grandTotal").textContent = formatEUR(total);
    document.getElementById("statusText").textContent = selectedCount > 0
      ? T.statusTextSelected(selectedCount)
      : T.statusTextEmpty;

    document.getElementById("btnBooking").disabled = selectedCount === 0;
  }

  function buildRecapHTML(){
    let html = "";
    let grandTotal = 0;

    for(const pack of PACKS){
      const sel = SELECTION.get(pack.name);
      if(!sel.active) continue;

      const calc = computePack(pack, sel);

      html += `<div class="recap-pack">`;
      html += `<div class="recap-pack-title">${escapeHtml(trPack(pack.name))}</div>`;

      for(const group of pack.groups){
        for(const service of group.services){
          const qty = clampInt(sel.services.get(service.id), 0, 999);
          if(qty > 0){
            html += `<div class="recap-line"><div>${escapeHtml(trService(service.title))} x ${qty}</div></div>`;
          }
        }
      }

      html += `<div class="recap-total"><div>${escapeHtml(T.packPriceLabel)}</div><div>${formatEUR(calc.displayPrice)}</div></div>`;
      html += `</div>`;

      grandTotal += calc.displayPrice;
    }

    html += `<div class="recap-grand"><div>${escapeHtml(T.grandTotalLabel)}</div><div>${formatEUR(grandTotal)}</div></div>`;
    return html;
  }

  function openLeadModal(){
    document.getElementById("fRecap").innerHTML = buildRecapHTML();
    document.getElementById("leadModal").style.display = "block";
  }

  function closeLeadModal(){
    document.getElementById("leadModal").style.display = "none";
  }

  function applyStaticTexts(){
    document.documentElement.lang = IS_EN ? "en" : "fr";

    document.getElementById("pageTitle").textContent = T.pageTitle;
    document.getElementById("pageSubtitle").textContent = T.pageSubtitle;
    document.getElementById("statusText").textContent = T.statusTextEmpty;
    document.getElementById("btnBooking").textContent = T.btnBooking;

    document.getElementById("leadTitle").textContent = T.leadTitle;
    document.getElementById("leadSubtitle").textContent = T.leadSubtitle;
    document.getElementById("closeLeadModal").textContent = T.close;

    document.getElementById("lCompany").textContent = T.lCompany;
    document.getElementById("lFirst").textContent = T.lFirst;
    document.getElementById("lLast").textContent = T.lLast;
    document.getElementById("lEmail").textContent = T.lEmail;
    document.getElementById("lPhone").textContent = T.lPhone;

    document.getElementById("fCompany").placeholder = T.phCompany;
    document.getElementById("fFirst").placeholder = T.phFirst;
    document.getElementById("fLast").placeholder = T.phLast;
    document.getElementById("fEmail").placeholder = T.phEmail;
    document.getElementById("fPhone").placeholder = T.phPhone;

    document.getElementById("recapTitle").textContent = T.recapTitle;
    document.getElementById("sendLead").textContent = T.send;
    document.getElementById("leadHint").textContent = T.bookingHint;
  }

  async function boot(){
    setLangLinks();
    applyStaticTexts();

    const status = document.getElementById("status");
    status.textContent = "";

    try {
      const res = await fetch(SHEET_CSV_URL, { cache:"no-store" });
      if(!res.ok) throw new Error("Catalog fetch failed");

      const text = await res.text();
      PACKS = buildCatalogFromRows(parseCsv(text));
      SELECTION = createInitialSelection(PACKS);

      document.getElementById("btnBooking").addEventListener("click", openLeadModal);
      document.getElementById("closeLeadModal").addEventListener("click", closeLeadModal);

      document.getElementById("sendLead").addEventListener("click", async () => {
        const bookingUrl = IS_EN ? BOOKING_URL_EN : BOOKING_URL_FR;

        const payload = {
          lang: IS_EN ? "en" : "fr",
          bookingUrl,
          company: document.getElementById("fCompany").value.trim(),
          firstname: document.getElementById("fFirst").value.trim(),
          lastname: document.getElementById("fLast").value.trim(),
          email: document.getElementById("fEmail").value.trim(),
          phone: document.getElementById("fPhone").value.trim(),
          recap: document.getElementById("fRecap").innerText,
          hasUpsell: selectedHasUpsell()
        };

        if(!payload.company || !payload.firstname || !payload.lastname || !payload.email || !payload.phone){
          return;
        }

        try {
          await fetch(WORKER_SEND_URL, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify(payload)
          });

          window.open(bookingUrl, "_blank");
          closeLeadModal();
        } catch(error) {
        }
      });

      render();
    } catch(error) {
      status.textContent = IS_EN ? "Unable to load the catalog." : "Impossible de charger le catalogue.";
    }
  }

  boot();
</script>
